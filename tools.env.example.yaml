# Copy to tools.env.yaml and fill in. tools.env.yaml is gitignored — never commit keys.
#
#   cp tools.env.example.yaml tools.env.yaml
#
# Rules:
#   - Only non-empty values are injected.
#   - No ${VAR} expansion; no inherit from the host environment.
#   - The console Settings page writes data/console/llm.yaml overrides.

version: 1

# ---------------------------------------------------------------------------
# Asset review Agent (vision model used to score candidates)
# ---------------------------------------------------------------------------
asset:
  ASSET_AGENT_BASE_URL: ""
  ASSET_AGENT_MODEL: ""
  ASSET_AGENT_API_KEY: ""
  ASSET_AGENT_PROMPT: ""
  ASSET_AGENT_RULE_VERSION: "asset-page-v1"
  # Chromium proxy for page capture. The control plane clears its proxy env on purpose, so the
  # review browser only reaches the internet when this is set, e.g. "http://host.docker.internal:7897".
  BROWSER_PROXY: ""

# ---------------------------------------------------------------------------
# ARL asset discovery
# ---------------------------------------------------------------------------
arl:
  ARL_URL: "http://arl-web:5003"
  ARL_TOKEN: ""

# ---------------------------------------------------------------------------
# FOFA asset discovery
# ---------------------------------------------------------------------------
fofa:
  FOFA_URL: "https://fofa.info"
  FOFA_KEY: ""
  # Optional HTTP proxy for fofa.info, e.g. "http://host.docker.internal:7897".
  # Leave empty to dial FOFA directly from the control-plane container.
  FOFA_PROXY: ""

# ---------------------------------------------------------------------------
# Blackbox agent, observer, Burp and recon tools
# ---------------------------------------------------------------------------
blackbox:
  BLACKBOX_AGENT_BASE_URL: ""
  BLACKBOX_AGENT_MODEL: ""
  BLACKBOX_AGENT_API_KEY: ""
  BLACKBOX_AGENT_PROMPT: ""
  # Per-request model timeout and output cap. A 1800-token cap truncates multi-tool plans
  # into invalid JSON, so the default is 4000; raise it for large batches.
  BLACKBOX_AGENT_TIMEOUT_MS: "180000"
  BLACKBOX_AGENT_MAX_TOKENS: "4000"
  BLACKBOX_OBSERVER_PROMPT: ""
  BLACKBOX_RUNTIME_RULES: ""
  BLACKBOX_OBSERVER_RUNTIME_RULES: ""
  # JSON object merged over the built-in defaults (see src/blackbox/rules.ts).
  # Invalid JSON is reported at console startup and in the session timeline, then
  # the whole document falls back to defaults: every tool callable, default budgets.
  # Tools are always available; this section only holds risk switches, e.g.
  # {"tools": {"recon.sql": {"allow_credential_attack": true}}}. A legacy
  # "enabled" flag is ignored with a warning.
  BLACKBOX_RULES_DOCUMENT: ""

  BURP_PROXY_URL: "http://host.docker.internal:8080"
  BURP_PROXY_REQUIRED: "true"
  # Direct-connect (no Burp in the loop): set BURP_PROXY_URL to "" and
  # BURP_PROXY_REQUIRED to "false" — the environment gate then reports ready and
  # plain http.request works without a proxy.
  BURP_IGNORE_HTTPS_ERRORS: "true"
  BURP_BRIDGE_URL: "http://host.docker.internal:8765"
  BURP_BRIDGE_TOKEN: ""

  # Planning without an LLM: off | auto (default) | force.
  # auto/force switch the main agent and the Observer to the deterministic local
  # planner (src/blackbox/local_plan.ts) whenever no model credentials are set,
  # so `nianyun run <url>` can finish a session with zero model calls.
  NIANYUN_LOCAL_PLANNER: "auto"

  KATANA_PATH: ""
  SUBFINDER_PATH: ""
  DNSX_PATH: ""
  HTTPX_PATH: ""
  NAABU_PATH: ""
  GAU_PATH: ""
  WAYBACKURLS_PATH: ""
  FFUF_PATH: ""
  NIANYUN_WORDLIST_ROOT: "/opt/nianyun/resources/wordlists"
  # 额外只读字典根（SecLists 挂载点）。多个根用 os 的 PATH 分隔符，或只设一个。
  SECLISTS_DIR: ""
  # nuclei 模板目录；recon.wordlists 会把它列给 Agent。
  NUCLEI_TEMPLATES_PATH: "/opt/nianyun/data/nuclei-templates"
  # exec.python / exec.bash 的隔离级别：
  #   首选的写法是下面的 SANDBOX_URL（sidecar 沙箱服务，一次性容器/microVM，出站强制走 MITM）。
  #   SANDBOX_URL 为空时才回落到本机：设了 EXEC_SANDBOX_IMAGE 且进程能访问 Docker 就走容器，
  #   否则进程级 jail（结果里 mode=local-jail、isolation=process-jail，不会冒充容器隔离）。
  #   控制面容器按设计**不挂** docker.sock，所以生产环境请用 sidecar。
  EXEC_SANDBOX_IMAGE: ""
  # Sidecar Sandbox Service（deploy/sandbox/，compose 里是 sandbox 服务）。
  # 跨调用持久目录：job 容器的 /state（volume subpath，每会话一个）。配额超了按最旧裁。
SANDBOX_STATE_VOLUME: "nianyun-sandbox-state"
SANDBOX_STATE_MAX_MB: "50"
SANDBOX_STATE_MAX_FILES: "100"
SANDBOX_STATE_TTL_H: "12"

SANDBOX_URL: ""            # 例：http://sandbox:8790
  SANDBOX_TOKEN: ""          # 与服务端一致；服务端没配 token 会拒绝启动
  # sqlmap/nuclei 的"单命令执行"参数（--os-cmd / --sql-query / --file-read / --file-write）默认关闭；
  # 只有人工监督的交互式会话才设为 true。--os-shell / --sql-shell 永久禁用。
  BLACKBOX_ALLOW_INTERACTIVE_EXEC: "false"
  # 目标可达性前置检查：环境检查里用同一条出网代理对会话目标发一次 GET。
  # 目标连不上（代理错误页 / 连接失败 / 超时）就判环境不通过，会话停在 environment_check，
  # 不开跑——否则整场预算会烧在代理错误页上，还会被当成"目标响应"派发假任务。
  #   BLACKBOX_TARGET_PROBE: "off"   跳过该检查（只在明确知道目标很慢时用）
  #   BLACKBOX_TARGET_PROBE_TIMEOUT_MS: 单次探测超时，默认 12000
  #   BLACKBOX_TARGET_PROBE_RETRIES: 传输层失败重试次数，默认 1（代理错误页不重试）
  BLACKBOX_TARGET_PROBE: "on"
  BLACKBOX_TARGET_PROBE_TIMEOUT_MS: "12000"
  BLACKBOX_TARGET_PROBE_RETRIES: "1"
  # Burp 被动扫描：会话开局由控制面替模型启动一次审计，之后每 3 轮把 site map 里新增的
  # high/medium 问题写进 context.system_interrupts（模型必须处置：取明细 → 复现 → 或写负向结论）。
  #   passive（默认）只审已经抓到的响应，不向目标发攻击载荷；
  #   active 会真发攻击载荷，且仍受规则文档 tools["burp.scan"].allow_active_scan 约束；
  #   off 完全不动（Burp Community 没有 Scanner 时会自动退化成"只读 site map"）。
  BLACKBOX_BURP_SCANNER: "passive"
  NUCLEI_PATH: ""
  INTERACTSH_URL: "https://oast.pro"
  INTERACTSH_CLIENT_PATH: "/usr/local/bin/interactsh-client"
  INTERACTSH_TOKEN: ""
  ARJUN_PATH: ""
  SUBJS_PATH: ""
  TESTSSL_PATH: ""
  KITERUNNER_PATH: ""
  DALFOX_PATH: ""
  SQLMAP_PATH: ""
  JWT_TOOL_PATH: ""
  GRAPHQL_COP_PATH: ""
  WPSCAN_PATH: ""
  TRUFFLEHOG_PATH: ""
  SEMGREP_PATH: ""

env: {}
required: []

# recon.sast 规则来源。留空＝用镜像内置的 resources/semgrep/nianyun-src.yml（离线可用）；
# 指向自备规则目录时同理，但不要用 --config auto：那需要回连 semgrep 注册表，容器出站走
# Burp/代理，注册表请求会挂到超时（实测 semgrep --version 都 >60s）。
SEMGREP_RULES_PATH=