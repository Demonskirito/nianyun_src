name: image

# 镜像守卫：push 到主干先跑 typecheck / build / 工具清单零漂移 / 测试；
# 全量 Docker 构建放在干净的 CI 环境里按计划或手动触发，验证 Dockerfile 自洽、
# 固定版本与校验和没有腐坏（本地构建同样可用，不再依赖 docker commit/cp）。
#
# 三个 job：
#   typecheck-and-test —— 每次 push 都跑：tsc、npm run build、manifest 一致性、vitest
#   build-fast         —— Dockerfile.fast 的 --no-cache 冒烟；仅在手动触发且给出
#                        已发布的 BASE_IMAGE 时运行（干净 CI 里没有本地基础镜像）
#   build-full         —— Dockerfile 全量工具链构建，每周一 03:00 UTC 或手动触发

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "console/**"
      - "deploy/**"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - "compose.yaml"
      - "compose.control.yaml"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "deploy/**"
      - "package-lock.json"
  schedule:
    - cron: "0 3 * * 1"        # 每周一 03:00 UTC 全量构建一次
  workflow_dispatch:
    inputs:
      fast_base_image:
        description: "build-fast 的 BASE_IMAGE（已发布到 GHCR 的工具镜像 tag）；留空用本地默认 nianyun:control"
        type: string
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            console/package-lock.json
      - run: npm ci
      # npm run build 的最后一环 build:console 需要 console/ 自己的依赖
      # (@vitejs/plugin-react / react / antd)。只装根依赖会让 vite build 直接失败。
      - run: npm --prefix console ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm run build
      - name: 工具清单必须与 dist 对齐（否则镜像里少工具）
        run: node scripts/gen-tool-manifest.mjs && git diff --exit-code generated/tool-manifest.json
      - run: npx vitest run --reporter=basic

  build-fast:
    # Dockerfile.fast 只替换应用产物，其 FROM 的 BASE_IMAGE 默认是**本地预建**的
    # nianyun:control 工具镜像；干净 CI 里既没有这个本地镜像、仓库也还没发布过 GHCR 包，
    # 所以不能随 push 自动跑（否则 typecheck 一变绿、这个 job 就必然失败）。
    # 可复现的全量构建由 build-full 在 schedule / workflow_dispatch 覆盖；
    # 只有手动触发且明确给出已发布 base 时才跑，否则 CI 里必然拉不到镜像。
    if: github.event_name == 'workflow_dispatch' && inputs.fast_base_image != ''
    runs-on: ubuntu-latest
    needs: typecheck-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 从零构建（--no-cache，证明 Dockerfile 自洽）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/control/Dockerfile.fast
          build-args: |
            BASE_IMAGE=${{ inputs.fast_base_image || 'nianyun:control' }}
          pull: true
          no-cache: true
          push: false
          tags: nianyun:control-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 冒烟：镜像能起、/health 通、四个协议模块在
        run: |
          docker run -d --name smoke -e NIANYUN_MODE=serve -p 18700:8700 nianyun:control-ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18700/health > /dev/null; then ok=1; break; fi
            sleep 3
          done
          test "${ok:-0}" = "1" || { docker logs smoke | tail -50; exit 1; }
          docker exec smoke sh -c 'ls /opt/nianyun/dist/blackbox/sovereignty.js /opt/nianyun/dist/blackbox/spa.js /opt/nianyun/dist/blackbox/replay_protocols.js /opt/nianyun/dist/blackbox/validation-envelope.js'
          docker rm -f smoke

  build-full:
    # 工具链全量构建：会下载 httpx/nuclei/… 并校验 SHA256，慢，按需触发
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: typecheck-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/control/Dockerfile
          pull: true
          no-cache: true
          push: false
          tags: nianyun:control-full-ci
      - name: 冒烟：扫描器都在 PATH 上
        run: |
          docker run --rm --entrypoint sh nianyun:control-full-ci -c 'for t in httpx katana nuclei subfinder dnsx naabu gau ffuf; do command -v $t || exit 1; done'